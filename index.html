<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowDev - طور مهاراتك</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #10b981;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .btn:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }
        .note {
            font-size: 12px;
            color: #f59e0b;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ShadowDev</h1>
        <p>نظام تطوير ذاتي بأسلوب RPG. قم بتحميل التطبيق الآن وابدأ رحلتك في تطوير مهاراتك!</p>
        
        <!-- رابط التحميل المباشر من جوجل درايف -->
        <a href="https://drive.google.com/uc?export=download&id=1MsZDiXiV9v5VAIIoFq_wtKYSylrV5go9" class="btn" target="_blank">تحميل التطبيق (APK)</a>
        
        <p class="note">ملاحظة: إذا ظهر لك تحذير، اختر "التثبيت من مصدر غير معروف".</p>
    </div>

</body>
</html>
