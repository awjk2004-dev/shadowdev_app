name: shadowdev_app
description: "ShadowDev - نظام النهوض"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # إدارة الحالة
  provider: ^6.1.1
  
  # الاتصال بالـ API
  dio: ^5.4.0
  
  # تخزين آمن للتوكن
  flutter_secure_storage: ^9.0.0
  
  # أيقونات وخطوط
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/